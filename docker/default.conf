server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 응답이 컨테이너에서 왔다는 표시
    add_header X-Served-By docker-container always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /health {
        default_type text/plain;
        return 200 "OK\n";
    }
}